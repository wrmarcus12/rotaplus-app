name: 📱 Compilar APK do Rota+

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Gerar Arquivo APK para Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK (17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🟢 Configurar Node.js (20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🤖 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Instalar Dependências do Capacitor
        run: |
          npm install --no-audit

      - name: ⚙️ Inicializar Projeto Android com Capacitor
        run: |
          if [ ! -d "android" ]; then
            echo "Criando pasta android nativa..."
            npx cap add android
          fi
          npx cap sync android

      - name: 🛡️ Injetar Permissões de GPS e Redes no AndroidManifest.xml
        run: |
          python3 -c "
          path = 'android/app/src/main/AndroidManifest.xml'
          content = open(path).read()
          perms = '''    <uses-permission android:name=\"android.permission.INTERNET\" />
              <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />
              <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
              <uses-feature android:name=\"android.hardware.location.gps\" android:required=\"false\" />
          '''
          if 'ACCESS_FINE_LOCATION' not in content:
              content = content.replace('<application', perms + '    <application')
              open(path, 'w').write(content)
              print('Permissões injetadas com sucesso.')
          else:
              print('Permissões já existentes.')
          "

      - name: 🎨 Atualizar Ícone do Aplicativo no Android
        run: |
          if [ -f "mvp/icon.png" ]; then
            echo "Configurando ícones do aplicativo..."
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp mvp/icon.png "$dir/ic_launcher.png"
                cp mvp/icon.png "$dir/ic_launcher_round.png"
                cp mvp/icon.png "$dir/ic_launcher_foreground.png" 2>/dev/null || true
              fi
            done
          fi

      - name: 🔑 Conceder Permissão de Execução ao Gradle Wrapper
        run: |
          chmod +x android/gradlew

      - name: 🔨 Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 🏷️ Renomear e Preparar APK Final
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/RotaPlus-v1.0.apk
          echo "APK gerado com sucesso em: output_apk/RotaPlus-v1.0.apk"
          ls -lh output_apk/

      - name: 📤 Publicar APK para Download (GitHub Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: RotaPlus-v1.0-APK
          path: output_apk/RotaPlus-v1.0.apk
          retention-days: 30

      - name: 🚀 Publicar APK no GitHub Releases (Download Direto)
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0
          name: "Rota+ Driver v1.0 (APK)"
          body: |
            ### 📱 Rota+ Driver v1.0
            
            Toque no link **RotaPlus-v1.0.apk** abaixo diretamente do navegador do seu celular para baixar e instalar o aplicativo!
          files: output_apk/RotaPlus-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
