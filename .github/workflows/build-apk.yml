name: 📱 Compilar APK do Rota+

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Gerar Arquivo APK para Android
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK (17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🟢 Configurar Node.js (20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📜 Aceitar Licenças do Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 📦 Instalar Dependências do Projeto
        run: |
          npm install --no-audit

      - name: ⚙️ Inicializar Projeto Android com Capacitor
        run: |
          if [ ! -d "android" ]; then
            echo "Criando pasta android nativa..."
            npx cap add android
          fi
          npx cap sync android

      - name: 🔑 Configurar Gradle Wrapper e local.properties
        run: |
          chmod +x android/gradlew
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: 🔨 Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_build.log

      - name: 📋 Salvar Log da Compilação (Debug em caso de erro)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log

      - name: 🏷️ Renomear e Preparar APK Final
        if: success()
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/RotaPlus-v1.0.apk
          echo "APK gerado com sucesso em: output_apk/RotaPlus-v1.0.apk"
          ls -lh output_apk/

      - name: 📤 Publicar APK para Download (GitHub Artifacts)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RotaPlus-v1.0-APK
          path: output_apk/RotaPlus-v1.0.apk
          retention-days: 30

      - name: 🚀 Publicar APK no GitHub Releases (Download Direto)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: "Rota+ Driver v1.0 (APK)"
          body: |
            ### 📱 Rota+ Driver v1.0
            
            Toque no link **RotaPlus-v1.0.apk** abaixo diretamente do navegador do seu celular para baixar e instalar o aplicativo!
          files: output_apk/RotaPlus-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
