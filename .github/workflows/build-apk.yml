name: 📱 Compilar APK do SpokeRoute Pro

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de Build (Debug ou Release não assinado)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Gerar Arquivo APK para Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK (17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🟢 Configurar Node.js (20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🤖 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Instalar Dependências do Capacitor
        run: |
          npm ci || npm install

      - name: ⚙️ Inicializar Projeto Android com Capacitor
        run: |
          if [ ! -d "android" ]; then
            echo "Criando pasta android nativa..."
            npx cap add android
          fi
          npx cap sync android

      - name: 🛡️ Injetar Permissões de GPS e Redes no AndroidManifest.xml
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if grep -q "ACCESS_FINE_LOCATION" "$MANIFEST_PATH"; then
            echo "Permissões de GPS já configuradas."
          else
            echo "Injetando permissões de GPS e Geolocalização..."
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />' "$MANIFEST_PATH"
          fi

      - name: 🎨 Atualizar Ícone do Aplicativo no Android
        run: |
          if [ -f "mvp/icon.png" ]; then
            echo "Configurando ícones do aplicativo..."
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp mvp/icon.png "$dir/ic_launcher.png"
                cp mvp/icon.png "$dir/ic_launcher_round.png"
                cp mvp/icon.png "$dir/ic_launcher_foreground.png" 2>/dev/null || true
              fi
            done
          fi

      - name: 🔑 Conceder Permissão de Execução ao Gradle Wrapper
        run: |
          chmod +x android/gradlew

      - name: 🔨 Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 🏷️ Renomear e Preparar APK Final
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/SpokeRoute-Pro-v1.0.apk
          echo "APK gerado com sucesso em: output_apk/SpokeRoute-Pro-v1.0.apk"
          ls -la output_apk/

      - name: 📤 Publicar APK para Download (GitHub Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: SpokeRoute-Pro-v1.0-APK
          path: output_apk/SpokeRoute-Pro-v1.0.apk
          retention-days: 30

      - name: 🚀 Criar Release Automática no GitHub (Opcional)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: output_apk/SpokeRoute-Pro-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
